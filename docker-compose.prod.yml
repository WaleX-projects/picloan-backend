version: '3.8'

services:
  # FastAPI Backend Service (Production)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pickloan-api-prod
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - NOVA_API_KEY=${NOVA_API_KEY}
      - NODE_ENV=production
    # Remove volumes in production (no hot-reload)
    networks:
      - pickloan-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Resource limits for production
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    # Security options
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only_root_filesystem: true
    tmpfs:
      - /tmp

networks:
  pickloan-network:
    driver: bridge
